<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Check Eligibility | Barnala Driver Training Academy</title>

<meta name="description" content="Choose your Class 1 driver training program and check your eligibility.">

<link rel="stylesheet" href="css/main.css">

</head>

<body>

<div id="site-header"></div>

<!-- HERO -->

<section class="hero">

    <div class="container">

        <span class="section-label">
            CLASS 1 DRIVER TRAINING
        </span>

        <h1>
            Choose Your Class 1 Course
        </h1>

        <p class="section-text">
            Select the Class 1 training program you wish to check eligibility for.
        </p>

        <div class="course-grid">

            <a href="eligibility-class1-121.html" class="course-card">

                <h3>121.5</h3>

                <span>Class 1 (121.5 Hrs)</span>

            </a>

            <a href="eligibility-class1-244.html" class="course-card">

                <h3>244</h3>

                <span>Class 1 (244 Hrs)</span>

            </a>

        </div>

    </div>

</section>

<div id="site-footer"></div>

<script>

fetch("header.html")
.then(res => res.text())
.then(html => {

    document.getElementById("site-header").innerHTML = html;

    const scripts = document
        .getElementById("site-header")
        .querySelectorAll("script");

    scripts.forEach(oldScript => {

        const newScript = document.createElement("script");

        if (oldScript.src) {
            newScript.src = oldScript.src;
        } else {
            newScript.textContent = oldScript.textContent;
        }

        document.body.appendChild(newScript);
        oldScript.remove();

    });

});

fetch("footer.html")
.then(res => res.text())
.then(html => {

    document.getElementById("site-footer").innerHTML = html;

});

</script>

</body>
</html>
