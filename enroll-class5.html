<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Enroll in Class 5 | Barnala Driver Training Academy
    </title>

    <meta name="description"
          content="Check your eligibility and enroll in Barnala Driver Training Academy's Class 5 Driver Training Program.">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/enroll-class5.css">

</head>

<body>

<div id="site-header"></div>

<main>

<!-- ==========================================
     HERO
========================================== -->

<section class="hero">

    <div class="hero-overlay"></div>

    <div class="hero-content">

        <span class="hero-tag">

            CLASS 5 DRIVER TRAINING

        </span>

        <h1>

            Enroll in<br>Class 5 Training

        </h1>

        <p>

            Check your eligibility in under one minute.
            If you qualify, complete your registration
            immediately without leaving this page.

        </p>

        <div class="hero-buttons">

            <a href="#wizard"
               class="hero-btn">

                Check Eligibility

            </a>

            <a href="class-5.html"
               class="hero-btn-outline">

                Learn About Class 5

            </a>

        </div>

    </div>

</section>

<!-- ==========================================
     WIZARD
========================================== -->

<section class="wizard-section"
         id="wizard">

    <div class="wizard-card">

        <div id="wizardContent">

        </div>

    </div>

</section>

</main>

<div id="site-footer"></div>

<script>

/* ==========================================
   ELEMENTS
========================================== */

const wizard =
document.getElementById("wizardContent");

/* ==========================================
   START
========================================== */

window.onload = function(){

    ageQuestion();

};

/* ==========================================
   QUESTION 1
========================================== */

function ageQuestion(){

wizard.innerHTML = `

<h2>

Are you 18 or plus?

</h2>

<p class="question-subtitle">

Applicants must be at least 18 years old
before enrolling in Class 5 Driver Training.

</p>

<div class="button-group">

<button onclick="ageYes()">

Yes

</button>

<button onclick="showContact()">

No

</button>

</div>

`;

}

function ageYes(){

knowledgeQuestion();

}

/* ==========================================
   QUESTION 2
========================================== */

function knowledgeQuestion(){

wizard.innerHTML = `

<h2>

Have you passed
Class 5 Knowledge Test?

</h2>

<p class="question-subtitle">

Passing the Class 5 Knowledge Test
is required before enrollment.

</p>

<div class="button-group">

<button onclick="eligible()">

Yes

</button>

<button onclick="showContact()">

No

</button>

</div>

`;

}
  /* ==========================================
   ELIGIBLE
========================================== */

function eligible(){

wizard.innerHTML = `

<div class="result-icon success">

✓

</div>

<h2>

Congratulations

</h2>

<p class="question-subtitle">

You are eligible to enrol in
Class 5 course.

</p>

<div class="button-group">

<button
class="result-btn"
onclick="showEnrollmentForm()">

Proceed with Enrollment

</button>

</div>

`;

}

/* ==========================================
   NOT ELIGIBLE
========================================== */

function showContact(){

wizard.innerHTML = `

<div class="result-icon error">

!

</div>

<h2>

No Worries

</h2>

<p class="question-subtitle">

Let's connect and make it possible.

</p>

<div class="button-group">

<button
class="result-btn"
onclick="showContactForm()">

Let's Connect

</button>

</div>

`;

}

/* ==========================================
   ENROLLMENT FORM
========================================== */

function showEnrollmentForm(){

wizard.innerHTML = `

<div class="enrollment-form">

<h2>

Class 5 Enrollment Form

</h2>

<p class="question-subtitle">

Complete the form below and our admissions
team will contact you shortly.

</p>

<form id="enrollForm">

<div class="form-row">

<div class="form-group">

<label>First Name *</label>

<input
type="text"
required>

</div>

<div class="form-group">

<label>Last Name *</label>

<input
type="text"
required>

</div>

</div>

<div class="form-row">

<div class="form-group">

<label>Phone Number *</label>

<input
type="tel"
required>

</div>

<div class="form-group">

<label>Email Address *</label>

<input
type="email"
required>

</div>

</div>

<div class="form-row">

<div class="form-group">

<label>Preferred Branch *</label>

<select required>

<option value="">

Select Branch

</option>

<option>

Winnipeg

</option>

<option>

Steinbach

</option>

<option>

Portage la Prairie

</option>

</select>

</div>

<div class="form-group">

<label>

Preferred Start Date

</label>

<input
type="date">

</div>

</div>

<div class="form-group">

<label>

Additional Information

</label>

<textarea
rows="5"></textarea>

</div>

<button
class="submit-btn"
type="submit">

Submit Enrollment

</button>

</form>

</div>

`;

document
.getElementById("enrollForm")
.addEventListener("submit",function(e){

e.preventDefault();

showThankYou();

});

}
  /* ==========================================
   CONTACT FORM
========================================== */

function showContactForm(){

wizard.innerHTML = `

<div class="enrollment-form">

<h2>

Let's Connect

</h2>

<p class="question-subtitle">

Complete the form below and our team will
help you become eligible for Class 5 Driver Training.

</p>

<form id="contactForm">

<div class="form-row">

<div class="form-group">

<label>First Name *</label>

<input
type="text"
required>

</div>

<div class="form-group">

<label>Last Name *</label>

<input
type="text"
required>

</div>

</div>

<div class="form-row">

<div class="form-group">

<label>Phone Number *</label>

<input
type="tel"
required>

</div>

<div class="form-group">

<label>Email Address *</label>

<input
type="email"
required>

</div>

</div>

<div class="form-group">

<label>

How can we help you?

</label>

<textarea
rows="5"
placeholder="Tell us how we can help..."></textarea>

</div>

<button
class="submit-btn"
type="submit">

Send Request

</button>

</form>

</div>

`;

document
.getElementById("contactForm")
.addEventListener("submit",function(e){

e.preventDefault();

showThankYou();

});

}

/* ==========================================
   THANK YOU
========================================== */

function showThankYou(){

wizard.innerHTML = `

<div class="thank-you">

<div class="result-icon success">

✓

</div>

<h2>

Thank You!

</h2>

<p>

Your request has been received successfully.

A member of the Barnala Driver Training Academy
team will contact you shortly.

</p>

<br>

<div class="button-group">

<button
class="result-btn"
onclick="ageQuestion()">

Return to Eligibility Checker

</button>

</div>

</div>

`;

}

</script>

<script>

fetch("header.html")
.then(r=>r.text())
.then(html=>{

document.getElementById("site-header").innerHTML = html;

document.getElementById("site-header")
.querySelectorAll("script")
.forEach(old=>{

const s = document.createElement("script");

if(old.src){

s.src = old.src;

}else{

s.textContent = old.textContent;

}

document.body.appendChild(s);

});

});

</script>

<script>

fetch("footer.html")
.then(r=>r.text())
.then(html=>{

document.getElementById("site-footer").innerHTML = html;

});

</script>

</body>

</html>
