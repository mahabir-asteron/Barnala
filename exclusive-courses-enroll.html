<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Enroll in Exclusive Courses | Barnala Driver Training Academy
    </title>

    <meta name="description"
          content="Check your eligibility and enroll in Barnala Driver Training Academy's Exclusive Courses.">

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/enroll-exclusive-courses.css">

</head>

<body>

<!-- ===========================
     HEADER
=========================== -->

<div id="site-header"></div>

<main>

<!-- ===========================
     HERO
=========================== -->

<section class="hero">

    <div class="hero-overlay"></div>

    <div class="hero-content">

        <span class="hero-tag">

            EXCLUSIVE COURSES

        </span>

        <h1>

            Enroll in<br>
            Exclusive Courses

        </h1>

        <p>

            Select your preferred exclusive course,
            check your eligibility in under one minute,
            and complete your registration without
            leaving this page.

        </p>

        <div class="hero-buttons">

            <a href="#wizard"
               class="hero-btn">

                Check Eligibility

            </a>

            <a href="exclusive-courses.html"
               class="hero-btn-outline">

                Explore Courses

            </a>

        </div>

    </div>

</section>

<!-- ===========================
     ENROLLMENT WIZARD
=========================== -->

<section class="wizard-section"
         id="wizard">

    <div class="wizard-card">

        <!-- Progress -->

        <div class="progress-wrapper">

            <div class="progress-bar">

                <span id="progressFill"></span>

            </div>

            <div class="progress-info">

                <span id="progressText">

                    Step 1 of 4

                </span>

                <button
                    id="backBtn"
                    class="back-btn"
                    style="display:none;">

                    ← Back

                </button>

            </div>

        </div>

        <!-- Dynamic Content -->

        <div id="wizardContent">

        </div>

    </div>

</section>

</main>

<!-- ===========================
     FOOTER
=========================== -->

<div id="site-footer"></div>

<script>

/* =========================================
   ELEMENTS
========================================= */

const wizard = document.getElementById("wizardContent");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const backBtn = document.getElementById("backBtn");

const TOTAL_STEPS = 4;

let history = [];

let selectedCourse = "";


  /* =========================================
   HELPERS
========================================= */

function render(html){

    wizard.style.opacity="0";
    wizard.style.transform="translateY(20px)";

    setTimeout(()=>{

        wizard.innerHTML=html;

        wizard.style.opacity="1";
        wizard.style.transform="translateY(0)";

    },180);

}

function updateProgress(step){

    progressFill.style.width=((step/TOTAL_STEPS)*100)+"%";

    progressText.textContent=`Step ${step} of ${TOTAL_STEPS}`;

}

function finishWizard(){

    progressFill.style.width="100%";

    progressText.textContent="Completed";

    backBtn.style.display="none";

}

function resetWizard(){

    history=[];

    selectedCourse="";

    backBtn.style.display="none";

    progressFill.style.width="25%";

    progressText.textContent="Step 1 of 4";

}

function saveStep(step){

    history.push(step);

    backBtn.style.display="inline-flex";

}

function goBack(){

    if(history.length===0){

        return;

    }

    const previous=history.pop();

    previous();

}

backBtn.addEventListener("click",goBack);

/* =========================================
   START
========================================= */

function startWizard(){

    resetWizard();

    courseQuestion();

}

window.addEventListener("load",startWizard);

  /* =========================================
   STEP 1
========================================= */

function courseQuestion(){

    updateProgress(1);

    render(`

        <h2>

            Which type of course do you want?

        </h2>

        <p class="question-subtitle">

            Select the course you would like to enroll in.

        </p>

        <div class="licence-grid">

            <div class="licence-card"
                 onclick="selectCourse('Hours of Service Course')">

                <h3>

                    Hours of Service

                </h3>

                <p>

                    Compliance Training

                </p>

            </div>

            <div class="licence-card"
                 onclick="selectCourse('Dangerous Goods Course')">

                <h3>

                    Dangerous Goods

                </h3>

                <p>

                    TDG Training

                </p>

            </div>

            <div class="licence-card"
                 onclick="selectCourse('Load Securement Course')">

                <h3>

                    Load Securement

                </h3>

                <p>

                    Cargo Securement

                </p>

            </div>

            <div class="licence-card"
                 onclick="selectCourse('Vehicle Inspection Course')">

                <h3>

                    Vehicle Inspection

                </h3>

                <p>

                    Daily Inspection

                </p>

            </div>

            <div class="licence-card"
                 onclick="selectCourse('Winter Driving Course')">

                <h3>

                    Winter Driving

                </h3>

                <p>

                    Winter Safety Training

                </p>

            </div>

        </div>

    `);

}

function selectCourse(course){

    selectedCourse = course;

    saveStep(courseQuestion);

    if(course === "Winter Driving Course"){

        winterLicenceQuestion();

    }else{

        eligible();

    }

}

  /* =========================================
   WINTER DRIVING LICENCE
========================================= */

function winterLicenceQuestion(){

    updateProgress(2);

    render(`

        <h2>

            Which class of License do you have?

        </h2>

        <p class="question-subtitle">

            Select your current licence.

        </p>

        <div class="licence-grid">

            <div class="licence-card"
                 onclick="winterLicenceSelected()">

                <h3>Class 5L</h3>

                <p>Learner Licence</p>

            </div>

            <div class="licence-card"
                 onclick="winterLicenceSelected()">

                <h3>Class 5I</h3>

                <p>Intermediate Licence</p>

            </div>

            <div class="licence-card"
                 onclick="winterLicenceSelected()">

                <h3>Class 5F</h3>

                <p>Full Licence</p>

            </div>

            <div class="licence-card"
                 onclick="winterLicenceSelected()">

                <h3>Class 3</h3>

                <p>Commercial Licence</p>

            </div>

            <div class="licence-card"
                 onclick="winterLicenceSelected()">

                <h3>Class 2</h3>

                <p>Bus Licence</p>

            </div>

        </div>

    `);

}

function winterLicenceSelected(){

    saveStep(winterLicenceQuestion);

    eligible();

}

/* =========================================
   RESULT
========================================= */

function eligible(){

    finishWizard();

    render(`

        <div class="result-icon success">

            ✓

        </div>

        <h2>

            Congratulations!

        </h2>

        <p class="question-subtitle">

            You are eligible to enroll in<br>

            <strong>${selectedCourse}</strong>

        </p>

        <div class="button-group">

            <button
                class="result-btn"
                onclick="showEnrollmentForm()">

                Proceed with Enrollment

            </button>

        </div>

    `);

}

  /* =========================================
   ENROLLMENT FORM
========================================= */

function showEnrollmentForm(){

    finishWizard();

    window.scrollTo({
        top:document.querySelector(".wizard-section").offsetTop-80,
        behavior:"smooth"
    });

    render(`

<div class="enrollment-form">

    <h2>

        Registration Request for Exclusive Course

    </h2>

    <p class="question-subtitle">

        Complete the form below and our admissions team
        will contact you to complete your enrollment.

    </p>

    <form id="exclusiveCourseForm">

        <div class="form-row">

            <div class="form-group">

                <label>

                    First Name *

                </label>

                <input
                    type="text"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Last Name *

                </label>

                <input
                    type="text"
                    required>

            </div>

        </div>

        <div class="form-row">

            <div class="form-group">

                <label>

                    Phone Number *

                </label>

                <input
                    type="tel"
                    placeholder="(XXX) XXX-XXXX"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Email Address *

                </label>

                <input
                    type="email"
                    placeholder="sample@example.com"
                    required>

            </div>

        </div>

        <div class="form-row">

            <div class="form-group">

                <label>

                    Selected Course

                </label>

                <input
                    type="text"
                    value="${selectedCourse}"
                    readonly>

            </div>

            <div class="form-group">

                <label>

                    Branch *

                </label>

                <select required>

                    <option value="">

                        Choose

                    </option>

                    <option>

                        Winnipeg

                    </option>

                    <option>

                        Steinbach

                    </option>

                    <option>

                        Portage la Prairie

                    </option>

                </select>

            </div>

        </div>

        <div class="form-group">

            <label>

                Message

            </label>

            <textarea
                rows="6"
                placeholder="Tell us anything you'd like us to know..."></textarea>

        </div>

        <button
            class="submit-btn"
            type="submit">

            Submit Registration Request

        </button>

    </form>

</div>

`);

    document
        .getElementById("exclusiveCourseForm")
        .addEventListener("submit",function(e){

            e.preventDefault();

            showThankYou();

        });

}

/* =========================================
   THANK YOU
========================================= */

function showThankYou(){

    render(`

<div class="thank-you">

    <div class="result-icon success">

        ✓

    </div>

    <h2>

        Thank You!

    </h2>

    <p>

        Your registration request has been received successfully.

        A member of the Barnala Driver Training Academy team
        will contact you shortly to complete your enrollment.

    </p>

    <br>

    <button
        class="result-btn"
        onclick="startWizard()">

        Return to Course Selection

    </button>

</div>

`);

}

</script>

  <script>

fetch("header.html")
.then(r=>r.text())
.then(html=>{

document.getElementById("site-header").innerHTML=html;

document.getElementById("site-header")
.querySelectorAll("script")
.forEach(old=>{

const s=document.createElement("script");

if(old.src){

    s.src=old.src;

}else{

    s.textContent=old.textContent;

}

document.body.appendChild(s);

old.remove();

});

});

fetch("footer.html")
.then(r=>r.text())
.then(html=>{

document.getElementById("site-footer").innerHTML=html;

});

</script>

</body>

</html>
